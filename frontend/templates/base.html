<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>{{ template "title" . }}</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          {{range .Links}}
          <li>
            <a
              href="{{.Path}}"
              {{if
              eq
              $.Path
              .Path}}
              aria-current="page"
              {{end}}
            >
              {{.Name}}
            </a>
          </li>
          {{end}}
        </ul>
      </nav>
    </header>
    <main>
      <h1>{{ template "header" . }}</h1>
      {{ template "body" . }}
    </main>
  </body>
</html>
